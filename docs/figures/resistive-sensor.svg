<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260" role="img" aria-labelledby="title desc">
  <title id="title">How a resistive soil probe senses moisture</title>
  <desc id="desc">Two metal tracks in soil sense how easily electricity passes between them. The FC-28 module converts the change into an analog signal for the Arduino.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#526777"/>
    </marker>
  </defs>
  <rect width="800" height="260" fill="#ffffff"/>
  <text x="36" y="42" fill="#1f2933" font-family="sans-serif" font-size="24" font-weight="700">Resistive probe</text>

  <rect x="36" y="72" width="350" height="142" rx="10" fill="#f4f0e8"/>
  <text x="54" y="100" fill="#526777" font-family="sans-serif" font-size="16">soil</text>
  <path d="M165 104v83M255 104v83" stroke="#7b5a3a" stroke-width="12" stroke-linecap="round"/>
  <path d="M178 145 C200 126 220 126 242 145" fill="none" stroke="#2586a3" stroke-width="3" stroke-dasharray="5 5"/>
  <circle cx="200" cy="117" r="5" fill="#6bb9cc"/>
  <circle cx="224" cy="168" r="5" fill="#6bb9cc"/>
  <text x="210" y="204" text-anchor="middle" fill="#526777" font-family="sans-serif" font-size="14">two metal tracks</text>

  <path d="M399 144h54" fill="none" stroke="#526777" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="466" y="104" width="146" height="80" rx="10" fill="#f7f9fa" stroke="#9aa9b3" stroke-width="1.5"/>
  <text x="539" y="137" text-anchor="middle" fill="#1f2933" font-family="sans-serif" font-size="18" font-weight="700">FC-28</text>
  <text x="539" y="160" text-anchor="middle" fill="#526777" font-family="sans-serif" font-size="14">module</text>
  <path d="M624 144h46" fill="none" stroke="#526777" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="685" y="139" fill="#1f2933" font-family="sans-serif" font-size="15">analog</text>
  <text x="685" y="158" fill="#1f2933" font-family="sans-serif" font-size="15">signal</text>

  <text x="36" y="244" fill="#526777" font-family="sans-serif" font-size="15">Moist soil often conducts better. The module determines whether its reading rises or falls.</text>
</svg>

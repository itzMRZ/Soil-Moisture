<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-labelledby="title desc">
  <title id="title">Soil monitor reading flow</title>
  <desc id="desc">The Arduino reads a raw value, maps it between the dry and wet calibration points to estimate a percentage, then shows the percentage and tier on the displays and serial monitor.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#526777"/>
    </marker>
  </defs>
  <rect width="900" height="220" fill="#ffffff"/>

  <g font-family="sans-serif">
    <text x="40" y="78" fill="#1f2933" font-size="20" font-weight="700">Read</text>
    <text x="40" y="108" fill="#526777" font-size="16">Raw ADC: 0 to 1023</text>

    <path d="M220 94h55" fill="none" stroke="#526777" stroke-width="2" marker-end="url(#arrow)"/>

    <text x="300" y="78" fill="#1f2933" font-size="20" font-weight="700">Calibrate</text>
    <text x="300" y="108" fill="#526777" font-size="16">Dry 1023 | Water 293</text>
    <text x="300" y="135" fill="#1f2933" font-size="17">Estimated: 0 to 100%</text>

    <path d="M535 94h55" fill="none" stroke="#526777" stroke-width="2" marker-end="url(#arrow)"/>

    <text x="615" y="78" fill="#1f2933" font-size="20" font-weight="700">Show result</text>
    <text x="615" y="108" fill="#526777" font-size="16">Tier + percentage</text>
    <text x="615" y="135" fill="#526777" font-size="16">LCD, OLED, Serial</text>
  </g>
</svg>
